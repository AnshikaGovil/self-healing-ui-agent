[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-ui-agent"
version = "1.1.0"
description = "Locator repair for UI automation: deterministic ranking plus a local language model, behind an HTTP API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rpa", "self-healing", "ui-automation", "selenium", "playwright",
            "llm", "llama-cpp", "locator-repair"]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "sentence-transformers>=2.7.0",
  "torch>=2.2.0",
  "numpy>=1.26.0",
  "llama-cpp-python>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["bis_core*", "healing_service*"]
